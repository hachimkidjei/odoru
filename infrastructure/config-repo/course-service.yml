server:
  port: 8082

spring:
  datasource:
    url: jdbc:postgresql://127.0.0.1:5434/odoru_course_db?sslmode=disable
    username: odoru
    password: odoru
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka

member-service:
  base-url: http://localhost:8081

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
  health:
    db:
      enabled: false