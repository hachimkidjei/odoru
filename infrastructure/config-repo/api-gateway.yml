server:
  port: 8085

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka

spring:
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8090/realms/odoru

  cloud:
    gateway:
      globalcors:
        add-to-simple-url-handler-mapping: true
        cors-configurations:
          '[/**]':
            allowedOrigins:
              - "http://localhost:5173"
            allowedMethods:
              - GET
              - POST
              - PUT
              - PATCH
              - DELETE
              - OPTIONS
            allowedHeaders:
              - "*"
            exposedHeaders:
              - "Authorization"
            allowCredentials: true

      discovery:
        locator:
          enabled: false

      routes:
        - id: member-service
          uri: lb://member-service
          predicates:
            - Path=/api/members/**

        - id: course-service
          uri: lb://course-service
          predicates:
            - Path=/api/courses/**

        - id: competition-service
          uri: lb://competition-service
          predicates:
            - Path=/api/competitions/**

        - id: badge-service
          uri: lb://badge-service
          predicates:
            - Path=/api/badges/**

        - id: statistics-service
          uri: lb://statistics-service
          predicates:
            - Path=/api/statistics/**

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway