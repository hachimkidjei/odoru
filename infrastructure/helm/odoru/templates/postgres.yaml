{{- range $key, $db := .Values.postgres.databases }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $db.serviceName }}
  namespace: {{ $.Values.global.namespace }}
  labels:
    app.kubernetes.io/name: odoru
    app.kubernetes.io/component: database
    app.kubernetes.io/instance: {{ $db.serviceName }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ $db.serviceName }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: odoru
        app.kubernetes.io/component: database
        app.kubernetes.io/instance: {{ $db.serviceName }}
    spec:
      containers:
        - name: postgres
          image: {{ $.Values.postgres.image }}
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: {{ $db.port }}
          env:
            - name: POSTGRES_DB
              value: {{ $db.name | quote }}
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: odoru-postgres-secret
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: odoru-postgres-secret
                  key: POSTGRES_PASSWORD
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $db.serviceName }}
  namespace: {{ $.Values.global.namespace }}
  labels:
    app.kubernetes.io/name: odoru
    app.kubernetes.io/component: database
    app.kubernetes.io/instance: {{ $db.serviceName }}
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/instance: {{ $db.serviceName }}
  ports:
    - name: postgres
      port: {{ $db.port }}
      targetPort: {{ $db.port }}
{{- end }}
