apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.services.discoveryService.name }}
  namespace: {{ .Values.global.namespace }}
  labels:
    app.kubernetes.io/name: odoru
    app.kubernetes.io/component: discovery-service
    app.kubernetes.io/instance: {{ .Values.services.discoveryService.name }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Values.services.discoveryService.name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: odoru
        app.kubernetes.io/component: discovery-service
        app.kubernetes.io/instance: {{ .Values.services.discoveryService.name }}
    spec:
      containers:
        - name: {{ .Values.services.discoveryService.name }}
          image: "{{ .Values.image.registry }}/{{ .Values.services.discoveryService.image }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          ports:
            - containerPort: {{ .Values.services.discoveryService.port }}
          env:
            - name: SERVER_PORT
              value: {{ .Values.services.discoveryService.port | quote }}
            - name: SPRING_CONFIG_IMPORT
              value: "optional:configserver:http://config-server:8888"
            - name: EUREKA_CLIENT_REGISTER_WITH_EUREKA
              value: "false"
            - name: EUREKA_CLIENT_FETCH_REGISTRY
              value: "false"
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.services.discoveryService.name }}
  namespace: {{ .Values.global.namespace }}
  labels:
    app.kubernetes.io/name: odoru
    app.kubernetes.io/component: discovery-service
    app.kubernetes.io/instance: {{ .Values.services.discoveryService.name }}
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/instance: {{ .Values.services.discoveryService.name }}
  ports:
    - name: http
      port: {{ .Values.services.discoveryService.port }}
      targetPort: {{ .Values.services.discoveryService.port }}
